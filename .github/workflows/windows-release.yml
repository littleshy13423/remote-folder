name: Desktop builds

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-exe-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  su-authentication:
    name: Verify su authentication on Linux
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: docker build -f tests/elevation/Dockerfile -t remote-folder-su-test .
      - run: docker run --rm --network none remote-folder-su-test

  build:
    name: Build and test Windows x64
    runs-on: windows-2022
    timeout-minutes: 35
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          architecture: x64
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Test application
        run: |
          python tests/test_api.py *> test-api.log
          $code = $LASTEXITCODE
          Get-Content test-api.log -Tail 40
          if ($code -ne 0) {
            $tail = ((Get-Content test-api.log -Tail 15) -join " ")
            Write-Host "::error::tests/test_api.py failed: $tail"
            exit $code
          }
          python -m unittest discover -s tests -p 'test_packaging*.py' -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p 'test_pool_elevation.py' -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build standalone EXE
        run: ./build.ps1 -Python python
      - name: Test packaged EXE outside the source directory
        run: ./scripts/smoke-test.ps1 -ExePath ./dist/remote-folder.exe
      - name: Test file transfers, path navigation and elevation controls
        run: |
          $testEnv = Join-Path $env:RUNNER_TEMP 'folder-drop-test'
          python -m venv --system-site-packages $testEnv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $testPython = Join-Path $testEnv 'Scripts/python.exe'
          & $testPython -m pip install playwright==1.64.1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $testPython tests/test_browser_drop.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $testPython tests/test_elevation_ui.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Save Windows download
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: remote-folder-windows-x64
          path: |
            dist/remote-folder.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  build-linux:
    name: Build and test Linux x64
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install GTK and WebKitGTK
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc pkg-config libcairo2-dev libgirepository1.0-dev \
            gir1.2-gtk-3.0 gir1.2-webkit2-4.0 libgtk-3-0 libwebkit2gtk-4.0-37 \
            xvfb dbus-x11 wmctrl
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Test application
        run: |
          python tests/test_api.py
          python -m unittest discover -s tests -p 'test_packaging*.py' -v
          python -m unittest discover -s tests -p 'test_pool_elevation.py' -v
      - name: Build standalone binary
        run: bash build.sh
      - name: Test packaged binary outside the source directory
        run: bash scripts/smoke-test.sh dist/remote-folder-linux-x64
      - name: Save Linux download
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: remote-folder-linux-x64
          path: |
            dist/remote-folder-linux-x64
            dist/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  release:
    name: Publish downloads
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, build-linux, su-authentication]
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: remote-folder-windows-x64
          path: dist/windows
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: remote-folder-linux-x64
          path: dist/linux
      - name: Publish verified downloads
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          GH_REPO: ${{ github.repository }}
        run: bash scripts/publish-release.sh
