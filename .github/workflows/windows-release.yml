name: Windows EXE

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-exe-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  su-authentication:
    name: Verify su authentication on Linux
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: docker build -f tests/elevation/Dockerfile -t remote-folder-su-test .
      - run: docker run --rm --network none remote-folder-su-test

  build:
    name: Build and test Windows x64
    runs-on: windows-2022
    timeout-minutes: 35
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          architecture: x64
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Test application
        run: |
          python tests/test_api.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p 'test_packaging*.py' -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p 'test_pool_elevation.py' -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build standalone EXE
        run: ./build.ps1 -Python python
      - name: Test packaged EXE outside the source directory
        run: ./scripts/smoke-test.ps1 -ExePath ./dist/remote-folder.exe
      - name: Test file transfers, path navigation and elevation controls
        run: |
          $testEnv = Join-Path $env:RUNNER_TEMP 'folder-drop-test'
          python -m venv --system-site-packages $testEnv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $testPython = Join-Path $testEnv 'Scripts/python.exe'
          & $testPython -m pip install playwright==1.64.1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $testPython tests/test_browser_drop.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $testPython tests/test_elevation_ui.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Save Windows download
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: remote-folder-windows-x64
          path: |
            dist/remote-folder.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  release:
    name: Publish Windows download
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, su-authentication]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: remote-folder-windows-x64
          path: dist
      - name: Publish verified EXE
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Use a version tag such as v0.1.0"; exit 1; }
          (cd dist && sha256sum --check SHA256SUMS.txt)
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; it will not be overwritten."
            exit 1
          fi
          gh release create "$RELEASE_TAG" dist/remote-folder.exe dist/SHA256SUMS.txt \
            --verify-tag --draft --title "remote-folder $RELEASE_TAG" \
            --notes-file .github/release-notes.md
          gh release edit "$RELEASE_TAG" --draft=false --latest
